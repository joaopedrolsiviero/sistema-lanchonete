<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <!-- Segurança: só roda código do próprio sistema e não se conecta a nenhum outro site. -->
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' http://127.0.0.1:* http://localhost:*; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Recanto do Café — Caixa</title>
  <meta name="theme-color" content="#6f4129">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo">
    <div class="marca"><span class="logo">☕</span> <span id="nome-loja">Recanto do Café</span></div>
    <nav class="abas">
      <a href="#pdv" data-rota="pdv">Caixa</a>
      <a href="#cardapio" data-rota="cardapio" class="protegida">Cardápio</a>
      <a href="#estoque" data-rota="estoque">Estoque <span id="badge-estoque" class="badge" hidden></span></a>
      <a href="#relatorios" data-rota="relatorios" class="protegida">Relatórios</a>
      <a href="#ajustes" data-rota="ajustes" class="protegida">Ajustes</a>
    </nav>
    <button type="button" id="btn-bloquear" class="btn mini bloquear" hidden title="Bloquear a área do dono">🔒 Bloquear</button>
  </header>
  <div id="faixa-backup" class="faixa-aviso" hidden></div>
  <div id="faixa-fiscal" class="faixa-aviso" hidden></div>

  <main id="conteudo"></main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="dialogo"></dialog>
  <!-- Área usada só na impressão da comanda -->
  <div id="impressao"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
